<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plaza Market — Catálogo</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0B1120">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Plaza Market">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { font-family: 'Inter', 'Segoe UI', 'Arial', sans-serif; -webkit-font-smoothing: antialiased; box-sizing: border-box; }
        body {
            background: linear-gradient(160deg, #0B1120 0%, #131B2E 45%, #1A1F3A 75%, #0B1120 100%);
            min-height: 100vh; margin: 0; color: #E2E8F0;
        }
        body::before {
            content: ''; position: fixed; inset: 0;
            background: radial-gradient(circle at 18% 15%, rgba(0,82,212,0.2) 0%, transparent 45%),
                        radial-gradient(circle at 85% 15%, rgba(88,28,135,0.22) 0%, transparent 45%);
            pointer-events: none; z-index: 0;
        }
        main, header { position: relative; z-index: 1; }
        .brand-logo {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #0052D4 0%, #3949AB 50%, #583C87 100%);
            border-radius: 0.9rem; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 24px rgba(0,82,212,0.4); flex-shrink: 0;
        }
        .btn-ghost-dark {
            background: rgba(255,255,255,0.04); color: #CBD5E1; border: 1.5px solid rgba(255,255,255,0.14);
            font-weight: 600; cursor: pointer; text-decoration: none;
        }
        .btn-ghost-dark:hover { background: rgba(255,255,255,0.08); }
        .btn-primary {
            background: linear-gradient(135deg, #0052D4 0%, #3949AB 50%, #583C87 100%);
            color: white; font-weight: 700; border: none; cursor: pointer; text-decoration: none;
            box-shadow: 0 4px 20px rgba(0,82,212,0.4);
        }
        .filtros { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
        .filtros input, .filtros select {
            background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.12);
            color: #F1F5F9; border-radius: 0.85rem; padding: 0.7rem 1rem; font-size: 0.85rem;
        }
        .filtros input { flex: 1; min-width: 180px; }
        .filtros input:focus, .filtros select:focus { outline: none; border-color: #3B82F6; }
        .filtros select option { background: #131B2E; }

        .seccion-titulo { font-size: 1rem; font-weight: 700; color: #E2E8F0; margin: 0 0 0.9rem; display: flex; align-items: center; gap: 0.5rem; }
        .strip { display: flex; gap: 0.9rem; overflow-x: auto; padding-bottom: 0.6rem; margin-bottom: 2rem; }
        .strip .card-producto { min-width: 190px; max-width: 190px; }

        .grid-productos { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 0.9rem; }
        .card-producto {
            background: rgba(255,255,255,0.035); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.09); border-radius: 1.25rem;
            overflow: hidden; display: flex; flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
            transition: transform 0.25s ease, box-shadow 0.25s ease; cursor: pointer;
            animation: fadeInUp 0.35s ease;
        }
        .card-producto:hover { transform: translateY(-4px); box-shadow: 0 28px 70px rgba(0,0,0,0.5); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .card-img-wrap { position: relative; }
        .card-img {
            width: 100%; height: 170px; object-fit: contain; display: block;
            background: #0B1120;
        }
        .card-img-placeholder {
            width: 100%; height: 170px; display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; background: linear-gradient(135deg, rgba(0,82,212,0.2), rgba(88,28,135,0.25));
        }
        .card-fotos-badge {
            position: absolute; bottom: 0.5rem; right: 0.5rem;
            background: rgba(11,17,32,0.8); color: #E2E8F0; font-size: 0.66rem; font-weight: 700;
            padding: 0.2rem 0.5rem; border-radius: 999px;
        }
        .badge-agotado {
            position: absolute; top: 0.5rem; left: 0.5rem;
            background: rgba(239,68,68,0.92); color: white; font-size: 0.66rem; font-weight: 800;
            padding: 0.25rem 0.6rem; border-radius: 999px; letter-spacing: 0.03em;
        }
        .img-agotada { filter: grayscale(0.7) brightness(0.6); }
        .card-body { padding: 1rem 1.1rem 1.2rem; flex: 1; display: flex; flex-direction: column; }
        .card-cat {
            font-size: 0.65rem; font-weight: 700; color: #93C5FD; text-transform: uppercase;
            letter-spacing: 0.04em; margin-bottom: 0.35rem;
        }
        .card-title { font-weight: 700; color: white; font-size: 0.95rem; line-height: 1.35; margin-bottom: 0.4rem; }
        .card-desc { font-size: 0.76rem; color: rgba(226,232,240,0.55); line-height: 1.5; flex: 1; margin-bottom: 0.8rem; }
        .card-precio {
            font-size: 1.15rem; font-weight: 800;
            background: linear-gradient(135deg, #60A5FA, #A78BFA);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .card-envio { font-size: 0.72rem; margin-top: 0.3rem; font-weight: 600; }
        .card-envio.gratis { color: #34D399; }
        .card-envio.pago { color: rgba(226,232,240,0.55); }
        .card-envio.servicio { color: #C4B5FD; }

        /* Cartel de envío (ficha del producto) */
        .envio-box {
            background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.11);
            border-radius: 0.9rem; padding: 0.95rem 1rem; margin-top: 0.8rem;
        }
        .envio-tit { font-size: 0.87rem; font-weight: 800; color: #FCD34D; margin: 0 0 0.45rem; }
        .envio-sub { font-size: 0.8rem; color: rgba(226,232,240,0.75); line-height: 1.6; margin: 0 0 0.55rem; }
        .envio-tip { font-size: 0.78rem; color: #6EE7B7; font-weight: 600; margin: 0 0 0.55rem; }
        .envio-paquete { font-size: 0.72rem; color: rgba(226,232,240,0.42); margin: 0 0 0.65rem; }
        .envio-toggle {
            background: none; border: none; color: #93C5FD; font-size: 0.78rem; font-weight: 700;
            cursor: pointer; padding: 0; text-decoration: underline;
        }
        .envio-pasos { font-size: 0.78rem; color: rgba(226,232,240,0.72); line-height: 1.65; margin: 0.7rem 0 0; padding-left: 1.2rem; }
        .envio-pasos li { margin-bottom: 0.4rem; }
        .card-stats { display: flex; gap: 0.9rem; margin-top: 0.55rem; font-size: 0.7rem; color: rgba(226,232,240,0.45); }
        .estado { text-align: center; padding: 4rem 1rem; color: rgba(226,232,240,0.45); font-size: 0.9rem; }
        .spinner {
            display: inline-block; width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.25); border-top-color: #3B82F6;
            border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 0.5rem; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .modal-fondo {
            position: fixed; inset: 0; z-index: 100; background: rgba(11,17,32,0.88);
            backdrop-filter: blur(8px); display: none; align-items: flex-start; justify-content: center;
            padding: 2rem 1rem; overflow-y: auto;
        }
        .modal-fondo.abierto { display: flex; }
        .modal-card {
            background: #131B2E; border: 1px solid rgba(255,255,255,0.1); border-radius: 1.5rem;
            max-width: 640px; width: 100%; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.6);
            animation: fadeInUp 0.3s ease;
        }
        .modal-cerrar {
            position: absolute; top: 1.2rem; right: 1.2rem; z-index: 101;
            background: rgba(11,17,32,0.85); border: 1px solid rgba(255,255,255,0.18); color: #E2E8F0;
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 1.1rem;
        }
        .modal-foto-wrap { position: relative; background: #0B1120; }
        .modal-foto-principal { width: 100%; height: 360px; object-fit: contain; display: block; background: #0B1120; cursor: zoom-in; }
        .modal-flecha {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 44px; height: 44px; border-radius: 50%; cursor: pointer; z-index: 5;
            background: rgba(11,17,32,0.7); border: 1px solid rgba(255,255,255,0.2); color: white;
            font-size: 1.5rem; display: flex; align-items: center; justify-content: center;
        }
        .modal-flecha:hover { background: rgba(11,17,32,0.95); }
        .modal-flecha.izq { left: 0.7rem; }
        .modal-flecha.der { right: 0.7rem; }
        .modal-contador-fotos {
            position: absolute; bottom: 0.7rem; left: 50%; transform: translateX(-50%);
            background: rgba(11,17,32,0.75); color: #E2E8F0; font-size: 0.7rem; font-weight: 700;
            padding: 0.25rem 0.7rem; border-radius: 999px; z-index: 5;
        }
        .modal-body { padding: 1.5rem; }
        .modal-precio {
            font-size: 1.7rem; font-weight: 800;
            background: linear-gradient(135deg, #60A5FA, #A78BFA);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .modal-desc { font-size: 0.9rem; color: rgba(226,232,240,0.75); line-height: 1.7; margin: 1rem 0; white-space: pre-wrap; }
        .modal-stats { display: flex; gap: 1.5rem; margin: 1rem 0; font-size: 0.8rem; color: rgba(226,232,240,0.55); }
        .modal-seccion { border-top: 1px solid rgba(255,255,255,0.09); margin-top: 1.3rem; padding-top: 1.1rem; }
        .modal-seccion-tit { font-size: 0.82rem; font-weight: 700; color: #93C5FD; margin-bottom: 0.7rem; }
        .mini-grid { display: flex; gap: 0.7rem; overflow-x: auto; padding-bottom: 0.4rem; }
        .mini-prod { min-width: 120px; max-width: 120px; cursor: pointer; }
        .mini-prod img, .mini-prod .mini-ph {
            width: 120px; height: 90px; object-fit: cover; border-radius: 0.6rem; display: block;
            background: linear-gradient(135deg, rgba(0,82,212,0.2), rgba(88,28,135,0.25));
        }
        .mini-prod .mini-ph { display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }
        .mini-prod p { font-size: 0.7rem; color: #E2E8F0; margin: 0.35rem 0 0; line-height: 1.3; }
        .mini-prod .mini-precio { color: #93C5FD; font-weight: 700; }
        .agotado-cartel {
            background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.35); color: #FCA5A5;
            border-radius: 0.75rem; padding: 0.6rem 0.9rem; font-size: 0.8rem; font-weight: 600; text-align: center; margin-top: 0.9rem;
        }
        .hidden { display: none !important; }

        /* Globito discreto para instalar la app */
        .install-pill {
            position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%) translateY(200%);
            z-index: 90; display: flex; align-items: center; gap: 0.35rem;
            background: linear-gradient(135deg, #0052D4 0%, #3949AB 55%, #583C87 100%);
            color: #fff; border-radius: 999px; padding: 0.5rem 0.55rem 0.5rem 1.05rem;
            box-shadow: 0 12px 34px rgba(0,82,212,0.5); font-size: 0.85rem; font-weight: 700;
            max-width: calc(100vw - 1.6rem);
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .install-pill.visible { transform: translateX(-50%) translateY(0); }
        .install-main { background: none; border: none; color: #fff; font: inherit; cursor: pointer; display: flex; align-items: center; gap: 0.45rem; padding: 0.15rem 0.2rem; }
        .install-emoji { display: inline-block; animation: wiggle 2.4s ease-in-out infinite; }
        @keyframes wiggle { 0%,86%,100% { transform: rotate(0); } 90% { transform: rotate(-13deg); } 93% { transform: rotate(11deg); } 96% { transform: rotate(-5deg); } }
        .install-x { background: rgba(255,255,255,0.22); border: none; color: #fff; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 0.78rem; flex-shrink: 0; line-height: 1; }
        .install-x:hover { background: rgba(255,255,255,0.4); }

        .lb { position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.95); display:none; align-items:center; justify-content:center; overflow:hidden; touch-action:none; }
        .lb.on { display:flex; }
        .lb-stage { width:100%; height:100%; display:flex; align-items:center; justify-content:center; overflow:hidden; }
        #lightboxImg { max-width:100%; max-height:100%; object-fit:contain; transform-origin:center center; will-change:transform; user-select:none; -webkit-user-drag:none; }
        .lb-close { position:absolute; top:1rem; right:1rem; z-index:5; width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); color:#fff; font-size:1.2rem; cursor:pointer; }
        .lb-arrow { position:absolute; top:50%; transform:translateY(-50%); z-index:5; width:48px; height:48px; border-radius:50%; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); color:#fff; font-size:1.6rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        .lb-left { left:1rem; } .lb-right { right:1rem; }
        .lb-counter { position:absolute; top:1rem; left:1rem; z-index:5; background:rgba(0,0,0,0.6); color:#fff; font-size:0.8rem; padding:0.3rem 0.8rem; border-radius:999px; }

        @media (max-width: 640px) {
            .modal-fondo { padding: 0; align-items: stretch; }
            .modal-card { border-radius: 0; max-width: 100%; min-height: 100vh; max-height: 100vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
            .modal-foto-principal { height: 44vh; }
            .modal-flecha { width: 40px; height: 40px; font-size: 1.3rem; }
        }

        /* Encabezado nuevo: menú (izq) + campana (der) */
        .hdr-btn {
            background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.14);
            color: #E2E8F0; border-radius: 0.7rem; width: 44px; height: 44px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            position: relative; font-size: 1.25rem;
        }
        .hdr-btn:hover { background: rgba(255,255,255,0.1); }
        .ham { display: block; width: 20px; height: 2px; background: #E2E8F0; border-radius: 2px; margin: 2.5px 0; }
        .notif-badge {
            position: absolute; top: -5px; right: -5px; min-width: 19px; height: 19px; padding: 0 4px;
            background: #EF4444; color: #fff; border-radius: 10px; font-size: 0.66rem; font-weight: 800;
            display: flex; align-items: center; justify-content: center; border: 2px solid #0B1120;
        }
        .menu-overlay {
            position: fixed; inset: 0; z-index: 60; background: rgba(11,17,32,0.6);
            backdrop-filter: blur(4px); display: none;
        }
        .menu-overlay.abierto { display: block; }
        .menu-panel {
            position: absolute; top: 0; left: 0; height: 100%; width: min(80vw, 300px);
            background: #131B2E; border-right: 1px solid rgba(255,255,255,0.1);
            box-shadow: 8px 0 40px rgba(0,0,0,0.5); padding: 1.25rem;
            display: flex; flex-direction: column; gap: 0.3rem;
            transform: translateX(-100%); transition: transform 0.22s ease;
        }
        .menu-overlay.abierto .menu-panel { transform: translateX(0); }
        .menu-cerrar { align-self: flex-end; background: none; border: none; color: rgba(226,232,240,0.55); font-size: 1.4rem; cursor: pointer; padding: 0 0.4rem; line-height: 1; margin: -0.3rem -0.3rem 0.3rem 0; }
        .menu-cerrar:hover { color: #fff; }
        .menu-cuenta {
            color: #93C5FD; font-size: 0.85rem; font-weight: 700;
            padding: 0.4rem 0.9rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 0.5rem;
        }
        .menu-item {
            display: block; padding: 0.9rem; border-radius: 0.7rem; color: #E2E8F0;
            text-decoration: none; font-size: 0.95rem; font-weight: 500;
        }
        .menu-item:hover { background: rgba(255,255,255,0.06); }
        .menu-salir { color: #FCA5A5; margin-top: 0.6rem; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 1rem; }
    </style>
</head>
<body>
    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
        <header class="flex items-center justify-between gap-3 mb-7">
            <button class="hdr-btn" onclick="toggleMenu()" aria-label="Menú" title="Menú">
                <span><span class="ham"></span><span class="ham"></span><span class="ham"></span></span>
            </button>
            <a href="plaza-market-catalogo.html" style="display:flex; align-items:center; gap:10px; text-decoration:none;">
                <svg viewBox="0 0 100 116" width="34" height="40" style="flex-shrink:0;"><path d="M50 8 C31 8 16 23 16 42 C16 66 50 108 50 108 C50 108 84 66 84 42 C84 23 69 8 50 8 Z" fill="#0057E7"/><circle cx="50" cy="40" r="13" fill="#fff"/></svg>
                <div>
                    <h1 class="text-xl font-bold" style="line-height:1.05;"><span style="color:#60A5FA;">Plaza</span> <span class="text-white">Market</span></h1>
                    <p class="text-xs text-slate-400 font-medium" id="subEncabezado">Catálogo</p>
                </div>
            </a>
            <button class="hdr-btn" onclick="window.location.href='plaza-market-mensajes.html'" aria-label="Mensajes" title="Mensajes">
                🔔
                <span id="notifBadge" class="notif-badge" style="display:none;">0</span>
            </button>
        </header>

        <!-- Menú desplegable -->
        <div id="menuOverlay" class="menu-overlay" onclick="cerrarMenu(event)">
            <nav class="menu-panel">
                <button type="button" class="menu-cerrar" onclick="cerrarMenu()" aria-label="Cerrar menú">✕</button>
                <div class="menu-cuenta" id="menuCuenta">—</div>
                <a href="plaza-market-catalogo.html" class="menu-item">Catálogo</a>
                <a href="plaza-market-panel-carga-productos.html" class="menu-item">Vender</a>
                <a href="plaza-market-mensajes.html" class="menu-item">Mensajes</a>
                <a href="plaza-market-perfil.html" class="menu-item">Mi perfil</a>
                <a href="#" class="menu-item" onclick="activarNotificaciones(event)">🔔 Activar notificaciones</a>
                <a href="plaza-market-super-admin.html" class="menu-item" id="menuAdmin" style="display:none;">Administrador</a>
                <a href="#" class="menu-item menu-salir" id="menuSalir" onclick="salir(event)">Salir</a>
            </nav>
        </div>

        <div class="filtros">
            <input type="text" id="buscador" placeholder="🔎 Buscar producto..." oninput="aplicarFiltros()">
            <select id="filtroCategoria" onchange="aplicarFiltros()">
                <option value="">Todas las categorías</option>
                <option value="perfumeria">Perfumería</option>
                <option value="cosmetica">Cosmética</option>
                <option value="indumentaria">Indumentaria</option>
                <option value="construccion">Construcción</option>
                <option value="pintura">Pintura</option>
                <option value="estetica">Estética y Belleza</option>
                <option value="masajes">Masajes y Bienestar</option>
                <option value="servicios">Servicios Profesionales</option>
                <option value="reformas">Reformas y refacciones</option>
            </select>
            <select id="ordenar" onchange="aplicarFiltros()">
                <option value="nuevo">Más nuevas primero</option>
                <option value="az">Nombre: A → Z</option>
                <option value="precio-bajo">Precio: más bajo</option>
                <option value="precio-alto">Precio: más alto</option>
                <option value="vistas">Más vistas</option>
            </select>
        </div>

        <div id="seccionHistorial" class="hidden">
            <p class="seccion-titulo">🕘 Vistos recientemente</p>
            <div id="stripHistorial" class="strip"></div>
        </div>

        <div id="contenido">
            <div class="estado"><span class="spinner"></span> Cargando productos...</div>
        </div>
    </main>

    <div id="modalFondo" class="modal-fondo" onclick="cerrarModalSiFondo(event)">
        <div class="modal-card" style="position: relative;">
            <button class="modal-cerrar" onclick="cerrarModal()">✕</button>
            <div class="modal-foto-wrap">
                <button class="modal-flecha izq hidden" id="flechaIzq" onclick="fotoAnterior(event)">‹</button>
                <img id="modalFotoPrincipal" class="modal-foto-principal" src="" alt="" onclick="abrirZoom()">
                <button class="modal-flecha der hidden" id="flechaDer" onclick="fotoSiguiente(event)">›</button>
                <span class="modal-contador-fotos hidden" id="modalContadorFotos"></span>
            </div>
            <div class="modal-body">
                <p class="card-cat" id="modalCat"></p>
                <h2 class="text-xl font-bold text-white mb-1" id="modalTitulo"></h2>
                <p class="modal-precio" id="modalPrecio"></p>
                <a id="modalBtnComprar" href="#" class="btn-primary" style="display:block;text-align:center;padding:0.85rem;border-radius:0.75rem;margin-bottom:0.6rem;background:linear-gradient(135deg,#059669 0%,#10B981 100%);box-shadow:0 4px 20px rgba(16,185,129,0.35);">🛒 Comprar ahora</a>
                <a id="modalBtnChat" href="#" class="btn-primary card-chat" style="display:block;text-align:center;padding:0.7rem;border-radius:0.75rem;">💬 Consultar al vendedor</a>
                <div id="modalAgotado" class="agotado-cartel hidden">Este producto está agotado por ahora.</div>
                <div id="modalEnvio" class="card-envio" style="margin-top:0.4rem;"></div>
                <p id="modalStock" class="text-sm" style="margin-top:0.4rem;color:rgba(226,232,240,0.6);"></p>
                <div class="modal-stats" id="modalStats"></div>
                <p class="modal-desc" id="modalDesc"></p>

    <script>
        const SUPABASE_URL = 'https://djpjgublkjtmprkcypma.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqcGpndWJsa2p0bXBya2N5cG1hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMDYwNTQsImV4cCI6MjA5ODg4MjA1NH0.pp3dWXoa-5iUtciNYce6L6DSOWuw3vbd-Do_YlhxusM';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const CATEGORY_LABELS = {
            cosmetica: 'Cosmética', perfumeria: 'Perfumería', indumentaria: 'Indumentaria',
            construccion: 'Construcción', pintura: 'Pintura', reformas: 'Reformas y refacciones',
            servicios: 'Servicios Profesionales', estetica: 'Estética y Belleza', masajes: 'Masajes y Bienestar'
        };

        let todos = [];
        let miUserId = null;
        let miNombre = '';
        let sesionActiva = false;
        let esAdmin = false;
        let fotosModal = [];
        let idxModal = 0;
        const SENA = 0.20; // seña del 20% para reservar un servicio

        function escaparHtml(t) { return String(t || '').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        function pesos(n) { return '$' + Number(n || 0).toLocaleString('es-AR'); }

        function toggleMenu() { document.getElementById('menuOverlay').classList.toggle('abierto'); }
        function cerrarMenu(e) {
            if (!e || e.target.id === 'menuOverlay') document.getElementById('menuOverlay').classList.remove('abierto');
        }

        function renderCuenta() {
            const sub = document.getElementById('subEncabezado');
            if (sub) sub.textContent = (sesionActiva && miNombre) ? ('Hola, ' + miNombre + ' · Catálogo') : 'Catálogo';
            const cuenta = document.getElementById('menuCuenta');
            const admin = document.getElementById('menuAdmin');
            const salirLink = document.getElementById('menuSalir');
            if (sesionActiva) {
                if (cuenta) cuenta.textContent = '👤 ' + (miNombre || 'Mi cuenta');
                if (admin) admin.style.display = esAdmin ? 'block' : 'none';
                if (salirLink) salirLink.style.display = 'block';
            } else {
                if (cuenta) cuenta.innerHTML = '<a href="plaza-market-acceso-emprendedores.html?next=plaza-market-catalogo.html" style="color:#93C5FD; text-decoration:none;">Ingresar / Crear cuenta</a>';
                if (admin) admin.style.display = 'none';
                if (salirLink) salirLink.style.display = 'none';
            }
        }

        // ---- Aviso de consultas nuevas (campana + sonido) ----
        let misProductosIds = new Set();

        function sonarNotif() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const o = ctx.createOscillator(); const g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.type = 'sine'; o.frequency.value = 720; g.gain.value = 0.06;
                o.start(); o.stop(ctx.currentTime + 0.18);
            } catch (e) {}
        }
        function pintarNotif(n) {
            const b = document.getElementById('notifBadge');
            if (!b) return;
            if (n > 0) { b.textContent = n > 99 ? '99+' : String(n); b.style.display = 'flex'; }
            else { b.style.display = 'none'; }
        }
        async function actualizarNotif() {
            if (!sesionActiva || !miUserId) { pintarNotif(0); return; }
            try {
                const { data: prods } = await db.from('productos').select('id').eq('usuario_id', miUserId);
                const ids = (prods || []).map(p => p.id);
                misProductosIds = new Set(ids.map(x => String(x)));
                if (!ids.length) { pintarNotif(0); return; }
                const { data: cons } = await db.from('pm_consultas').select('producto_id, usuario_id').in('producto_id', ids);
                const salas = (cons || []).map(c => 'prod' + c.producto_id + '_' + c.usuario_id);
                if (!salas.length) { pintarNotif(0); return; }
                const { data: lec } = await db.from('pm_lecturas').select('conversacion, ultima_lectura').eq('usuario_id', miUserId).in('conversacion', salas);
                const leidoMap = {};
                (lec || []).forEach(l => { leidoMap[l.conversacion] = new Date(l.ultima_lectura).getTime(); });
                const { data: msgs } = await db.from('mensajes').select('conversacion, autor, creado_en').in('conversacion', salas);
                const noLeidas = new Set();
                (msgs || []).forEach(m => {
                    if (m.autor === miNombre) return;
                    const t = new Date(m.creado_en).getTime();
                    if (t > (leidoMap[m.conversacion] || 0)) noLeidas.add(m.conversacion);
                });
                pintarNotif(noLeidas.size);
            } catch (e) { pintarNotif(0); }
        }
        function escucharNotif() {
            db.channel('notif-cat')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensajes' }, (payload) => {
                    const m = payload.new;
                    if (!m || !m.conversacion || m.autor === miNombre) return;
                    if (m.conversacion.slice(0, 4) !== 'prod') return;
                    const pidStr = (m.conversacion.split('_')[0] || '').slice(4);
                    if (misProductosIds.has(pidStr)) { sonarNotif(); actualizarNotif(); }
                })
                .subscribe();
        }

        // ---------- Notificaciones push (Nivel 2) ----------
        const VAPID_PUBLIC = 'BG3lDIXsuM-1zek-R2pkAUG7-0wHzEG8dYxhG-GZhDSqCmMMS-EQ4gTuvw5VvlWXxWWHRESmk3DS17fDK9YoukA';

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); });
        }

        function urlB64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const raw = atob(base64);
            const out = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
            return out;
        }

        async function guardarSuscripcion(sub) {
            if (!miUserId) return;
            const j = sub.toJSON();
            await db.from('pm_push_subs').upsert({
                usuario_id: miUserId,
                endpoint: sub.endpoint,
                p256dh: j.keys.p256dh,
                auth: j.keys.auth
            }, { onConflict: 'endpoint' });
        }

        async function activarNotificaciones(e) {
            if (e) e.preventDefault();
            if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
                alert('Tu navegador no soporta notificaciones. Probá con la app instalada o con Chrome en el celu.');
                return;
            }
            if (!sesionActiva) {
                alert('Primero iniciá sesión para activar las notificaciones.');
                return;
            }
            const permiso = await Notification.requestPermission();
            if (permiso !== 'granted') {
                alert('No se activaron las notificaciones. Podés hacerlo más tarde desde el menú.');
                return;
            }
            try {
                const reg = await navigator.serviceWorker.ready;
                let sub = await reg.pushManager.getSubscription();
                if (!sub) {
                    sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8Array(VAPID_PUBLIC) });
                }
                await guardarSuscripcion(sub);
                alert('¡Listo! Vas a recibir notificaciones de Plaza Market. 🔔');
            } catch (err) {
                alert('No se pudo activar: ' + (err.message || err));
            }
        }

        async function sincronizarPush() {
            if (!sesionActiva || !('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return;
            if (Notification.permission !== 'granted') return;
            try {
                const reg = await navigator.serviceWorker.ready;
                let sub = await reg.pushManager.getSubscription();
                if (!sub) {
                    sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8Array(VAPID_PUBLIC) });
                }
                await guardarSuscripcion(sub);
            } catch (e) {}
        }
        async function salir(e) {
            if (e) e.preventDefault();
            await db.auth.signOut();
            localStorage.removeItem('pm_uid');
            location.reload();
        }
        function agotado(p) { return p.tipo === 'producto' && p.stock !== null && p.stock !== undefined && p.stock <= 0; }

        // Despliega/oculta los 3 pasos del envío en la ficha del producto
        function toggleComoEnvio(e) {
            if (e) e.preventDefault();
            const pasos = document.getElementById('comoEnvio');
            if (pasos) pasos.classList.toggle('hidden');
        }

        async function cargarCatalogo() {
            // ¿Hay un vendedor logueado mirando? (para no contar sus propias vistas)
            try {
                const { data: { session } } = await db.auth.getSession();
                if (session) {
                    miUserId = session.user.id; sesionActiva = true;
                    const { data: perf } = await db.from('pm_perfiles').select('nombre').eq('id', miUserId).maybeSingle();
                    miNombre = (perf && perf.nombre) || session.user.email;
                    const { data: adminRow } = await db.from('pm_admins').select('id').eq('id', miUserId).maybeSingle();
                    esAdmin = !!adminRow;
                }
            } catch (e) {}
            if (!miUserId) miUserId = localStorage.getItem('pm_uid');
            renderCuenta();
            actualizarNotif();
            escucharNotif();
            sincronizarPush();

            const cont = document.getElementById('contenido');
            const { data, error } = await db.from('productos').select('*').order('creado_en', { ascending: false }).limit(300);
            if (error) {
                cont.innerHTML = `<div class="estado">⚠️ Error de conexión:<br><b style="color:#FCA5A5;">${error.message}</b><br>código: ${error.code || '—'}</div>`;
                return;
            }
            todos = data || [];
            renderHistorial();
            aplicarFiltros();
        }

        function ordenarLista(lista) {
            const modo = document.getElementById('ordenar').value;
            const l = lista.slice();
            if (modo === 'az') l.sort((a, b) => (a.titulo || '').localeCompare(b.titulo || '', 'es'));
            else if (modo === 'precio-bajo') l.sort((a, b) => Number(a.precio) - Number(b.precio));
            else if (modo === 'precio-alto') l.sort((a, b) => Number(b.precio) - Number(a.precio));
            else if (modo === 'vistas') l.sort((a, b) => (b.vistas || 0) - (a.vistas || 0));
            else l.sort((a, b) => new Date(b.creado_en) - new Date(a.creado_en));
            return l;
        }

        function aplicarFiltros() {
            const texto = document.getElementById('buscador').value.trim().toLowerCase();
            const cat = document.getElementById('filtroCategoria').value;
            let lista = todos;
            if (cat) lista = lista.filter(p => p.categoria === cat);
            if (texto) lista = lista.filter(p =>
                (p.titulo || '').toLowerCase().includes(texto) || (p.descripcion || '').toLowerCase().includes(texto));
            renderProductos(ordenarLista(lista));
        }

        function tarjetaHTML(p) {
            const esServicio = p.tipo === 'servicio';
            const nFotos = (p.fotos && p.fotos.length) || 0;
            const agot = agotado(p);
            const imgClase = agot ? 'card-img img-agotada' : 'card-img';
            const img = nFotos
                ? `<img src="${p.fotos[0]}" alt="${escaparHtml(p.titulo)}" class="${imgClase}" loading="lazy">${nFotos > 1 ? `<span class="card-fotos-badge">📷 ${nFotos}</span>` : ''}`
                : `<div class="card-img-placeholder">${esServicio ? '🛠️' : '📦'}</div>`;
            const badgeAgot = agot ? '<span class="badge-agotado">AGOTADO</span>' : '';
            const desc = escaparHtml(p.descripcion).slice(0, 100);

            let envio;
            if (esServicio) { const sena = Math.round(Number(p.precio || 0) * SENA); envio = `<p class="card-envio servicio">🔖 Seña para reservar: ${pesos(sena)}</p>`; }
            else envio = '<p class="card-envio pago" style="letter-spacing:0.03em;font-weight:700;">ENVÍO APARTE</p>';

            return `
            <article class="card-producto" onclick="abrirModal(${p.id})">
                <div class="card-img-wrap">${badgeAgot}${img}</div>
                <div class="card-body">
                    <p class="card-cat">${CATEGORY_LABELS[p.categoria] || p.categoria}</p>
                    <h2 class="card-title">${escaparHtml(p.titulo)}</h2>
                    <p class="card-desc">${desc}${desc.length >= 100 ? '…' : ''}</p>
                    <p class="card-precio">${pesos(p.precio)}</p>
                    ${envio}
                    <div class="card-stats">
                        <span>👁 ${p.vistas || 0} vistas</span>
                        <span>💬 ${p.consultas || 0} consultas</span>
                    </div>
                </div>
            </article>`;
        }

        function renderProductos(lista) {
            const cont = document.getElementById('contenido');
            if (!lista.length) {
                cont.innerHTML = todos.length
                    ? '<div class="estado">No encontramos productos con ese filtro. 🤔</div>'
                    : '<div class="estado">Todavía no hay productos publicados.<br>¡Sé el primero en publicar! 🚀</div>';
                return;
            }
            cont.innerHTML = '<div class="grid-productos">' + lista.map(tarjetaHTML).join('') + '</div>';
        }

        // ============================================================
        // HISTORIAL (guardado en el navegador del visitante)
        // ============================================================
        function leerHistorial() {
            try { return JSON.parse(localStorage.getItem('pm_historial') || '[]'); } catch (e) { return []; }
        }
        function guardarEnHistorial(id) {
            let h = leerHistorial().filter(x => x !== id);
            h.unshift(id);
            h = h.slice(0, 8);
            localStorage.setItem('pm_historial', JSON.stringify(h));
        }
        function renderHistorial() {
            const cont = document.getElementById('seccionHistorial');
            // Con pocos productos, "Vistos recientemente" solo duplica el catálogo. Lo mostramos cuando el catálogo crece.
            if (todos.length < 4) { cont.classList.add('hidden'); return; }
            const ids = leerHistorial();
            const items = ids.map(id => todos.find(p => p.id === id)).filter(Boolean);
            if (!items.length) { cont.classList.add('hidden'); return; }
            document.getElementById('stripHistorial').innerHTML = items.map(tarjetaHTML).join('');
            cont.classList.remove('hidden');
        }

        // ============================================================
        // VISTA GRANDE + CONTADOR
        // ============================================================
        function miniHTML(p) {
            const foto = (p.fotos && p.fotos[0])
                ? `<img src="${p.fotos[0]}" alt="">`
                : `<div class="mini-ph">${p.tipo === 'servicio' ? '🛠️' : '📦'}</div>`;
            return `<div class="mini-prod" onclick="abrirModal(${p.id})">
                ${foto}
                <p>${escaparHtml((p.titulo || '').slice(0, 28))}</p>
                <p class="mini-precio">${pesos(p.precio)}</p>
            </div>`;
        }

        async function abrirModal(id) {
            const p = todos.find(x => x.id === id);
            if (!p) return;

            const esServicio = p.tipo === 'servicio';
            const fotos = (p.fotos && p.fotos.length) ? p.fotos : [];
            const agot = agotado(p);

            document.getElementById('modalCat').textContent = CATEGORY_LABELS[p.categoria] || p.categoria;
            document.getElementById('modalTitulo').textContent = p.titulo;
            document.getElementById('modalPrecio').textContent = pesos(p.precio);
            document.getElementById('modalDesc').textContent = p.descripcion || 'Sin descripción.';

            const envioEl = document.getElementById('modalEnvio');
            if (esServicio) {
                const sena = Math.round(Number(p.precio || 0) * SENA);
                envioEl.className = 'card-envio servicio';
                envioEl.innerHTML = `🔖 Para reservar el turno se paga una <strong>seña de ${pesos(sena)}</strong> (20% del precio). El resto lo abonás al recibir el servicio. Se coordina por chat.`;
            }
            else {
                envioEl.className = '';
                const tieneMedidas = p.alto_cm && p.ancho_cm && p.largo_cm && p.peso_gr;
                const medidasHtml = tieneMedidas
                    ? `<p class="envio-paquete">📦 Paquete: ${p.alto_cm} × ${p.ancho_cm} × ${p.largo_cm} cm · ${(Number(p.peso_gr) / 1000).toLocaleString('es-AR')} kg</p>`
                    : '';
                envioEl.innerHTML = `
                    <div class="envio-box">
                        <p class="envio-tit">🚚 SOBRE EL ENVÍO</p>
                        <p class="envio-sub">El precio es solo del producto; el envío va aparte. Para saber tu costo, consultá al vendedor por el chat y te pasa un link de Andreani. Ahí cargás tus datos y ves el precio.</p>
                        <p class="envio-tip">💡 Consejo: a sucursal gastás menos que a domicilio.</p>
                        ${medidasHtml}
                        <button type="button" class="envio-toggle" onclick="toggleComoEnvio(event)">¿Cómo es el envío? ▾</button>
                        <ol id="comoEnvio" class="envio-pasos hidden">
                            <li>Consultás al vendedor por el chat y arreglan la compra.</li>
                            <li>El vendedor te pasa un link de Andreani. Ahí ponés tu código postal, <strong>ves el precio</strong> y elegís sucursal o domicilio.</li>
                            <li>Pagás el envío con Mercado Pago y el vendedor despacha tu paquete.</li>
                        </ol>
                    </div>`;
            }

            const stockEl = document.getElementById('modalStock');
            if (p.tipo === 'producto' && !agot) { stockEl.textContent = `📦 ${p.stock} en stock`; stockEl.classList.remove('hidden'); }
            else stockEl.classList.add('hidden');

            fotosModal = fotos;
            idxModal = 0;
            mostrarFoto();

            document.getElementById('modalStats').innerHTML =
                `<span>👁 ${p.vistas || 0} vistas</span><span>💬 ${p.consultas || 0} consultas</span>`;

            // Botón consultar — según el caso
            const btn = document.getElementById('modalBtnChat');
            const btnComprar = document.getElementById('modalBtnComprar');
            const cartel = document.getElementById('modalAgotado');
            btn.classList.add('hidden'); btnComprar.classList.add('hidden'); cartel.classList.add('hidden');
            if (agot) {
                cartel.textContent = 'Este producto está agotado por ahora.';
                cartel.style.cssText = 'background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.35); color:#FCA5A5;';
                cartel.classList.remove('hidden');
            } else if (sesionActiva && miUserId === p.usuario_id) {
                cartel.textContent = '📦 Esta es tu propia publicación. Para editarla, andá a "Vender".';
                cartel.style.cssText = 'background:rgba(0,82,212,0.12); border:1px solid rgba(59,130,246,0.4); color:#BFDBFE;';
                cartel.classList.remove('hidden');
            } else {
                btnComprar.classList.remove('hidden');
                btnComprar.textContent = esServicio ? '🔖 Pagar seña y reservar' : '🛒 Comprar ahora';
                btnComprar.onclick = (e) => { e.preventDefault(); comprar(p); };

                btn.classList.remove('hidden');
                btn.textContent = esServicio ? '💬 Consultar / Reservar' : '💬 Consultar al vendedor';
                btn.onclick = (e) => { e.preventDefault(); consultar(p); };
            }

            // Más del vendedor
            const delVend = todos.filter(x => x.usuario_id === p.usuario_id && x.id !== p.id).slice(0, 10);
            const secVend = document.getElementById('modalDelVendedor');
            if (delVend.length) { document.getElementById('gridDelVendedor').innerHTML = delVend.map(miniHTML).join(''); secVend.classList.remove('hidden'); }
            else secVend.classList.add('hidden');

            // También podría interesarte (misma categoría, de otros vendedores)
            const interesar = todos.filter(x => x.categoria === p.categoria && x.id !== p.id && x.usuario_id !== p.usuario_id).slice(0, 10);
            const secInt = document.getElementById('modalInteresar');
            if (interesar.length) { document.getElementById('gridInteresar').innerHTML = interesar.map(miniHTML).join(''); secInt.classList.remove('hidden'); }
            else secInt.classList.add('hidden');

            document.getElementById('modalFondo').scrollTop = 0;
            document.getElementById('modalFondo').classList.add('abierto');
            document.body.style.overflow = 'hidden';

            guardarEnHistorial(p.id);

            // Contar la vista — salvo que sea el propio vendedor mirando lo suyo
            if (miUserId && miUserId === p.usuario_id) return;
            p.vistas = (p.vistas || 0) + 1;
            document.getElementById('modalStats').innerHTML =
                `<span>👁 ${p.vistas} vistas</span><span>💬 ${p.consultas || 0} consultas</span>`;
            db.rpc('sumar_vista', { pid: p.id }).then(({ error }) => { if (error) console.error(error); });
        }

        function mostrarFoto() {
            const principal = document.getElementById('modalFotoPrincipal');
            const contador = document.getElementById('modalContadorFotos');
            const izq = document.getElementById('flechaIzq');
            const der = document.getElementById('flechaDer');

            if (!fotosModal.length) {
                principal.classList.add('hidden');
                contador.classList.add('hidden'); izq.classList.add('hidden'); der.classList.add('hidden');
                return;
            }
            principal.src = fotosModal[idxModal];
            principal.classList.remove('hidden');

            if (fotosModal.length > 1) {
                contador.textContent = `${idxModal + 1} / ${fotosModal.length}`;
                contador.classList.remove('hidden');
                izq.classList.remove('hidden');
                der.classList.remove('hidden');
            } else {
                contador.classList.add('hidden'); izq.classList.add('hidden'); der.classList.add('hidden');
            }
        }

        function fotoAnterior(e) {
            if (e) e.stopPropagation();
            if (!fotosModal.length) return;
            idxModal = (idxModal - 1 + fotosModal.length) % fotosModal.length;
            mostrarFoto();
        }
        function fotoSiguiente(e) {
            if (e) e.stopPropagation();
            if (!fotosModal.length) return;
            idxModal = (idxModal + 1) % fotosModal.length;
            mostrarFoto();
        }

        // Deslizar con el dedo en el celular
        let touchX0 = null;
        const fotoWrap = () => document.querySelector('.modal-foto-wrap');
        document.addEventListener('DOMContentLoaded', () => {
            const w = fotoWrap();
            if (!w) return;
            w.addEventListener('touchstart', e => { touchX0 = e.changedTouches[0].clientX; }, { passive: true });
            w.addEventListener('touchend', e => {
                if (touchX0 === null) return;
                const dx = e.changedTouches[0].clientX - touchX0;
                if (Math.abs(dx) > 40) { dx < 0 ? fotoSiguiente() : fotoAnterior(); }
                touchX0 = null;
            }, { passive: true });
        });

        // ============================================================
        // COMPRAR / PAGAR SEÑA (Mercado Pago)
        // ============================================================
        async function comprar(p) {
            if (!sesionActiva) {
                alert('Para comprar necesitás tener una cuenta (es gratis). Te llevamos al registro.');
                window.location.href = 'plaza-market-acceso-emprendedores.html?next=plaza-market-catalogo.html';
                return;
            }
            const b = document.getElementById('modalBtnComprar');
            const textoOriginal = b.textContent;
            b.textContent = 'Preparando el pago...';
            b.style.pointerEvents = 'none';
            b.style.opacity = '0.7';
            try {
                const { data, error } = await db.functions.invoke('mp-crear-pago', {
                    body: { producto_id: p.id, tipo: (p.tipo === 'servicio' ? 'sena' : 'producto') }
                });
                if (error) {
                    alert('No se pudo preparar el pago. ' + (error.message || ''));
                } else if (data && data.ok && data.url) {
                    window.location.href = data.url;
                    return;
                } else {
                    alert((data && data.error) ? data.error : 'No se pudo preparar el pago.');
                }
            } catch (e) {
                alert('Error inesperado: ' + (e && e.message ? e.message : e));
            }
            b.textContent = textoOriginal;
            b.style.pointerEvents = '';
            b.style.opacity = '';
        }

        async function consultar(p) {
            // La vidriera es abierta, pero para consultar/reservar hay que tener cuenta.
            if (!sesionActiva) {
                alert('Para consultar o reservar necesitás tener una cuenta (es gratis). Te llevamos al registro.');
                window.location.href = 'plaza-market-acceso-emprendedores.html?next=plaza-market-catalogo.html';
                return;
            }
            // 1 consulta por persona interesada — la base no cuenta de más aunque vuelva a consultar.
            // IMPORTANTE: esperamos (await) a que se registre ANTES de cambiar de página. Si no,
            // el navegador cancela el pedido al navegar y la consulta se pierde.
            try { await db.rpc('registrar_consulta', { pid: p.id }); } catch (e) { console.error(e); }
            // Sala PRIVADA por comprador: cada uno tiene su charla con el vendedor, nadie ve la del otro
            const sala = 'prod' + p.id + '_' + miUserId;
            window.location.href = 'plaza-market-chat-servicios.html?sala=' + encodeURIComponent(sala);
        }

        function cerrarModal() {
            document.getElementById('modalFondo').classList.remove('abierto');
            document.body.style.overflow = '';
            renderHistorial();
            aplicarFiltros();
        }
        // ============================================================
        // ZOOM (lightbox con navegación, pellizco y arrastre)
        // ============================================================
        let lbScale = 1, lbTx = 0, lbTy = 0;
        let lbStartX = 0, lbStartY = 0, lbBaseTx = 0, lbBaseTy = 0, lbDragging = false, lbMoved = false;
        let lbPinchDist = 0, lbPinchScale = 1, lbSwipeX = null;

        function lbAplicar() {
            document.getElementById('lightboxImg').style.transform = `translate(${lbTx}px, ${lbTy}px) scale(${lbScale})`;
        }
        function lbReset() { lbScale = 1; lbTx = 0; lbTy = 0; lbAplicar(); }

        function lbMostrar() {
            document.getElementById('lightboxImg').src = fotosModal[idxModal] || '';
            const varias = fotosModal.length > 1;
            document.getElementById('lbCounter').textContent = varias ? `${idxModal + 1} / ${fotosModal.length}` : '';
            document.getElementById('lbLeft').style.display = varias ? 'flex' : 'none';
            document.getElementById('lbRight').style.display = varias ? 'flex' : 'none';
            lbReset();
        }

        function abrirZoom() {
            if (!fotosModal.length) return;
            document.getElementById('lightbox').classList.add('on');
            lbMostrar();
        }
        function cerrarZoom() {
            document.getElementById('lightbox').classList.remove('on');
            mostrarFoto();
        }
        function lbAnterior(e) { if (e) e.stopPropagation(); if (!fotosModal.length) return; idxModal = (idxModal - 1 + fotosModal.length) % fotosModal.length; lbMostrar(); }
        function lbSiguiente(e) { if (e) e.stopPropagation(); if (!fotosModal.length) return; idxModal = (idxModal + 1) % fotosModal.length; lbMostrar(); }

        (function initLightbox() {
            const stage = document.getElementById('lbStage');
            const img = document.getElementById('lightboxImg');
            if (!stage) return;
            const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);

            stage.addEventListener('wheel', (e) => {
                e.preventDefault();
                lbScale = Math.min(4, Math.max(1, lbScale + (e.deltaY < 0 ? 0.25 : -0.25)));
                if (lbScale === 1) { lbTx = 0; lbTy = 0; }
                lbAplicar();
            }, { passive: false });

            img.addEventListener('dblclick', (e) => { e.preventDefault(); lbScale = lbScale > 1 ? 1 : 2.5; lbTx = 0; lbTy = 0; lbAplicar(); });

            stage.addEventListener('mousedown', (e) => {
                if (lbScale <= 1) return;
                lbDragging = true; lbMoved = false;
                lbStartX = e.clientX; lbStartY = e.clientY; lbBaseTx = lbTx; lbBaseTy = lbTy;
            });
            window.addEventListener('mousemove', (e) => {
                if (!lbDragging) return;
                lbMoved = true;
                lbTx = lbBaseTx + (e.clientX - lbStartX); lbTy = lbBaseTy + (e.clientY - lbStartY); lbAplicar();
            });
            window.addEventListener('mouseup', () => { lbDragging = false; });

            stage.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) { lbPinchDist = dist(e.touches[0], e.touches[1]); lbPinchScale = lbScale; }
                else if (e.touches.length === 1) {
                    lbMoved = false;
                    if (lbScale > 1) { lbDragging = true; lbStartX = e.touches[0].clientX; lbStartY = e.touches[0].clientY; lbBaseTx = lbTx; lbBaseTy = lbTy; }
                    else { lbSwipeX = e.touches[0].clientX; }
                }
            }, { passive: false });
            stage.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    const d = dist(e.touches[0], e.touches[1]);
                    lbScale = Math.min(4, Math.max(1, lbPinchScale * (d / (lbPinchDist || d))));
                    if (lbScale === 1) { lbTx = 0; lbTy = 0; }
                    lbAplicar();
                } else if (e.touches.length === 1 && lbDragging) {
                    e.preventDefault();
                    lbMoved = true;
                    lbTx = lbBaseTx + (e.touches[0].clientX - lbStartX); lbTy = lbBaseTy + (e.touches[0].clientY - lbStartY); lbAplicar();
                }
            }, { passive: false });
            stage.addEventListener('touchend', (e) => {
                lbDragging = false;
                if (lbSwipeX !== null && lbScale <= 1 && e.changedTouches.length) {
                    const dx = e.changedTouches[0].clientX - lbSwipeX;
                    if (Math.abs(dx) > 45) { dx < 0 ? lbSiguiente() : lbAnterior(); }
                }
                lbSwipeX = null;
            });

            stage.addEventListener('click', (e) => {
                if (e.target.id === 'lbStage' && !lbMoved && lbScale <= 1) cerrarZoom();
            });
        })();

        function cerrarModalSiFondo(e) { if (e.target.id === 'modalFondo') cerrarModal(); }
        document.addEventListener('keydown', e => {
            if (document.getElementById('lightbox').classList.contains('on')) {
                if (e.key === 'ArrowLeft') lbAnterior();
                else if (e.key === 'ArrowRight') lbSiguiente();
                else if (e.key === 'Escape') cerrarZoom();
                return;
            }
            if (e.key === 'Escape') cerrarModal();
        });

        // ============================================================
        // GLOBITO "INSTALAR APP" (discreto, se cierra, con onda)
        // ============================================================
        let pmDeferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); pmDeferredPrompt = e; });

        function pmAppInstalada() {
            return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        }
        function pmEsMobile() { return /android|iphone|ipad|ipod|mobile|windows phone/i.test(navigator.userAgent); }
        function pmEsIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream; }

        function mostrarInstallPill() {
            if (!pmEsMobile()) return;                       // el globito habla del "celu"
            if (pmAppInstalada()) return;                    // ya la tiene
            if (localStorage.getItem('pm_install_off') === '1') return;  // ya lo cerró antes
            const p = document.getElementById('installPill');
            if (p) setTimeout(() => p.classList.add('visible'), 2600);
        }
        function cerrarInstall() {
            const p = document.getElementById('installPill');
            if (p) p.classList.remove('visible');
            localStorage.setItem('pm_install_off', '1');
        }
        async function instalarApp() {
            if (pmDeferredPrompt) {
                pmDeferredPrompt.prompt();
                try { await pmDeferredPrompt.userChoice; } catch (e) {}
                pmDeferredPrompt = null;
                cerrarInstall();
                return;
            }
            // Donde el navegador no deja instalar, guiamos con onda
            const t = document.getElementById('installText');
            if (t) t.textContent = pmEsIOS() ? 'Tocá Compartir y "Agregar a inicio" 😊' : 'Abrila en Chrome para instalarla 😊';
        }
        window.addEventListener('load', mostrarInstallPill);

        window.addEventListener('DOMContentLoaded', cargarCatalogo);
    </script>
</body>
