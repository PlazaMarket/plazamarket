name: Fichas para compartir

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fichas
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --no-package-lock sharp@0.33.5
      - run: node scripts/fichas.mjs
      - name: Guardar cambios
        run: |
          git config user.name "plaza-market-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf node_modules
          git add -A p
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualizar fichas para compartir"
          git push
