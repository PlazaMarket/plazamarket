<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plaza Market — Acceso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            font-family: 'Inter', 'Segoe UI', 'Arial', sans-serif;
            -webkit-font-smoothing: antialiased;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(160deg, #0B1120 0%, #131B2E 45%, #1A1F3A 75%, #0B1120 100%);
            min-height: 100vh;
            margin: 0;
            color: #E2E8F0;
        }

        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(circle at 18% 18%, rgba(0, 82, 212, 0.24) 0%, transparent 45%),
                radial-gradient(circle at 85% 12%, rgba(88, 28, 135, 0.26) 0%, transparent 45%),
                radial-gradient(circle at 50% 95%, rgba(57, 73, 171, 0.2) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        main { position: relative; z-index: 1; }

        :root {
            --primary: #0052D4;
            --indigo-deep: #3949AB;
            --violet-deep: #583C87;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
        }

        button, input { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }

        .brand-logo {
            width: 52px; height: 52px;
            background: linear-gradient(135deg, #0052D4 0%, #3949AB 50%, #583C87 100%);
            border-radius: 1rem;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 26px rgba(0, 82, 212, 0.45);
            flex-shrink: 0;
        }

        .glass-card {
            background: rgba(255,255,255,0.035);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 1.75rem;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
            position: relative;
            overflow: hidden;
        }

        .tabs { display: flex; gap: 0.5rem; padding: 0.4rem; background: rgba(255,255,255,0.03); border-radius: 1rem; margin: 1.5rem 1.75rem 0; }
        .tab-btn {
            flex: 1; padding: 0.65rem; border-radius: 0.75rem; border: none; cursor: pointer;
            background: transparent; color: rgba(226,232,240,0.55); font-weight: 700; font-size: 0.82rem;
        }
        .tab-btn.tab-active {
            background: linear-gradient(135deg, #0052D4 0%, #3949AB 100%);
            color: white; box-shadow: 0 6px 18px rgba(0, 82, 212, 0.4);
        }

        label { color: rgba(226,232,240,0.75); font-size: 0.82rem; font-weight: 700; }

        input {
            background: rgba(255,255,255,0.04);
            border: 1.5px solid rgba(255,255,255,0.12);
            color: #F1F5F9;
            border-radius: 0.85rem;
            width: 100%;
            padding: 0.8rem 1rem;
            font-size: 0.9rem;
        }
        input::placeholder { color: rgba(226,232,240,0.32); }
        input:focus {
            outline: none;
            border-color: #3B82F6;
            box-shadow: 0 0 0 4px rgba(0, 82, 212, 0.22);
            background: rgba(255,255,255,0.06);
        }
        input.input-success { border-color: var(--success); background: rgba(16,185,129,0.08); }
        input.input-error { border-color: var(--danger); background: rgba(239,68,68,0.08); }

        .field-message { font-size: 0.72rem; margin-top: 0.4rem; min-height: 0.9rem; color: rgba(226,232,240,0.5); }
        .field-message.success { color: #34D399; }
        .field-message.error { color: #FCA5A5; }
        .icon-success { color: #34D399; font-weight: 800; }
        .icon-error { color: #FCA5A5; font-weight: 800; }

        .password-wrapper { position: relative; }
        .password-toggle-btn {
            position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%);
            background: transparent; border: none; cursor: pointer; color: rgba(226,232,240,0.5); padding: 0.2rem;
        }
        .password-toggle-btn:hover { color: #93C5FD; }

        .btn-primary {
            background: linear-gradient(135deg, #0052D4 0%, #3949AB 50%, #583C87 100%);
            color: white; font-weight: 700;
            position: relative; overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 82, 212, 0.45);
            border: none; cursor: pointer;
        }
        .btn-primary::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }
        .btn-primary:hover:not(:disabled)::before { left: 100%; }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 20px 44px rgba(0, 82, 212, 0.55), 0 0 30px rgba(88, 28, 135, 0.3);
        }
        .btn-primary:disabled { background: #475569; box-shadow: none; cursor: not-allowed; }

        .btn-ghost-dark {
            background: rgba(255,255,255,0.04); color: #CBD5E1; border: 1.5px solid rgba(255,255,255,0.12);
            font-weight: 600; cursor: pointer;
        }
        .btn-ghost-dark:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.22); }

        .checkbox-row { display: flex; align-items: flex-start; gap: 0.65rem; }
        .checkbox-row input[type="checkbox"] { width: auto; accent-color: #0052D4; margin-top: 0.2rem; flex-shrink: 0; }
        .checkbox-row span { font-size: 0.76rem; color: rgba(226,232,240,0.6); line-height: 1.5; }

        .info-note {
            background: rgba(0, 82, 212, 0.08); border: 1px solid rgba(0, 82, 212, 0.25);
            border-radius: 0.85rem; padding: 0.75rem 1rem; font-size: 0.76rem; color: #BFDBFE; line-height: 1.5;
        }

        .step-fade { animation: stepFade 0.35s ease; }
        @keyframes stepFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .inline-loading { display: flex; align-items: center; justify-content: center; gap: 0.6rem; padding: 2.5rem 1rem; }
        .spinner-inline {
            display: inline-block; width: 15px; height: 15px;
            border: 2px solid rgba(255,255,255,0.25); border-top-color: #3B82F6;
            border-radius: 50%; animation: spin 0.7s linear infinite;
        }
        .spinner-mini {
            display: inline-block; width: 13px; height: 13px;
            border: 2px solid rgba(255,255,255,0.4); border-top-color: white;
            border-radius: 50%; animation: spin 0.7s linear infinite;
            margin-right: 6px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .otp-container { display: flex; gap: 0.6rem; justify-content: center; margin: 1.25rem 0; }
        .otp-input {
            width: 2.7rem; height: 3.2rem; text-align: center; font-size: 1.3rem; font-weight: 800;
            border-radius: 0.8rem; background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.15); color: white;
        }
        .otp-input.filled { border-color: #3B82F6; background: rgba(0,82,212,0.14); }
        .otp-input.error { border-color: var(--danger) !important; background: rgba(239,68,68,0.15) !important; animation: shake 0.4s; }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

        .success-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 50;
        }
        .success-modal.hidden { display: none; }
        .success-card {
            background: rgba(255,255,255,0.035); backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.09); border-radius: 1.75rem;
            padding: 2rem; max-width: 420px; text-align: center;
        }
        .success-icon { font-size: 4rem; margin-bottom: 1rem; }
        .owner-success-icon { color: #F59E0B; }

        .toast {
            position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 60;
            background: rgba(15,23,42,0.95); border: 1px solid rgba(255,255,255,0.15);
            padding: 1rem 1.25rem; border-radius: 0.85rem; backdrop-filter: blur(12px);
            color: #E2E8F0; animation: slideIn 0.3s ease;
        }
        .toast.info { border-left: 3px solid #3B82F6; }
        .toast.success { border-left: 3px solid #34D399; }
        .toast.error { border-left: 3px solid #FCA5A5; }
        .toast.hide { animation: slideOut 0.3s ease forwards; }
        @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { to { transform: translateX(400px); opacity: 0; } }
    </style>
</head>
<body>
    <main class="flex flex-col items-center justify-center min-h-screen p-4">
        <div class="w-full max-w-md">
            <!-- HEADER CON LOGO -->
            <div class="flex items-center justify-center mb-8 gap-3">
                <div class="brand-logo">
                    <svg viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 text-white">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-white">Plaza Market</h1>
            </div>

            <!-- TARJETA PRINCIPAL -->
            <div class="glass-card p-0 overflow-hidden">
                <!-- TABS -->
                <div class="tabs">
                    <button class="tab-btn tab-active" onclick="switchTab('login')">Acceso</button>
                    <button class="tab-btn" onclick="switchTab('register')">Registro</button>
                </div>

                <!-- CONTENIDO DE TABS -->
                <div class="p-7">
                    <!-- TAB: LOGIN -->
                    <div id="loginTab" class="step-fade">
                        <div class="space-y-4">
                            <div>
                                <label for="loginEmail">Email</label>
                                <input type="email" id="loginEmail" placeholder="tu@email.com" />
                                <div class="field-message" id="loginEmailMessage"></div>
                            </div>

                            <div>
                                <label for="loginPassword">Contraseña</label>
                                <div class="password-wrapper">
                                    <input type="password" id="loginPassword" placeholder="••••••••" />
                                    <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('loginPassword', this)">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                                    </button>
                                </div>
                                <div class="field-message" id="loginPasswordMessage"></div>
                            </div>

                            <button class="btn-primary w-full py-2.5 rounded-lg mt-6" onclick="attemptLogin()">
                                <span class="inline-block">Acceder →</span>
                            </button>
                        </div>
                    </div>

                    <!-- TAB: REGISTRO (PASO 1 - CAMPOS) -->
                    <div id="registerTab" class="hidden">
                        <div id="registerStepFields" class="step-fade space-y-4">
                            <div>
                                <label for="regEmail">Email</label>
                                <input type="email" id="regEmail" placeholder="tu@email.com" />
                                <div class="field-message" id="regEmailMessage"></div>
                            </div>

                            <div>
                                <label for="regPassword">Contraseña (mín. 6 caracteres)</label>
                                <div class="password-wrapper">
                                    <input type="password" id="regPassword" placeholder="••••••••" />
                                    <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('regPassword', this)">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                                    </button>
                                </div>
                                <div class="field-message" id="regPasswordMessage"></div>
                            </div>

                            <div class="checkbox-row">
                                <input type="checkbox" id="regTerms" />
                                <span>Acepto los <a href="plaza-market-terminos-condiciones.html" target="_blank" class="text-blue-400 hover:underline">Términos y Condiciones</a></span>
                            </div>

                            <button class="btn-primary w-full py-2.5 rounded-lg mt-6" onclick="attemptRegister()">
                                Crear Cuenta →
                            </button>
                        </div>

                        <!-- PASO 2: VERIFICACIÓN OTP -->
                        <div id="registerStepVerify" class="hidden step-fade">
                            <div class="text-center mb-4">
                                <p class="text-sm text-slate-300">Ingresa el código de 6 dígitos que enviamos a:</p>
                                <p class="text-sm font-semibold text-blue-300 mt-1" id="otpEmailDisplay"></p>
                            </div>

                            <div class="otp-container">
                                <input class="otp-input" type="text" id="regOtp0" maxlength="1" />
                                <input class="otp-input" type="text" id="regOtp1" maxlength="1" />
                                <input class="otp-input" type="text" id="regOtp2" maxlength="1" />
                                <input class="otp-input" type="text" id="regOtp3" maxlength="1" />
                                <input class="otp-input" type="text" id="regOtp4" maxlength="1" />
                                <input class="otp-input" type="text" id="regOtp5" maxlength="1" />
                            </div>

                            <div class="field-message text-center" id="otpMessage"></div>

                            <div class="flex gap-3 mt-6">
                                <button class="btn-ghost-dark flex-1 py-2 rounded-lg text-sm" onclick="goBackToRegister()">
                                    ← Atrás
                                </button>
                                <button class="btn-primary flex-1 py-2 rounded-lg text-sm" onclick="verifyRegistrationOtp()">
                                    Verificar
                                </button>
                            </div>

                            <p class="text-xs text-slate-400 text-center mt-4">
                                ¿No recibiste el código? <button onclick="resendOtpCode()" class="text-blue-400 hover:underline">Reintentar</button>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL DE ÉXITO -->
    <div id="successModal" class="success-modal hidden">
        <div class="success-card">
            <div class="success-icon" id="successIcon">✅</div>
            <h2 class="text-xl font-bold text-white mb-2" id="successTitle">¡Cuenta Verificada!</h2>
            <p class="text-sm text-slate-300 mb-6" id="successMessage"></p>
            <a id="successDashboardLink" href="#" class="btn-primary w-full py-2.5 rounded-lg text-sm inline-block text-center">
                Ir a mi Panel →
            </a>
        </div>
    </div>

    <script>
        // ============================================================
        // INICIALIZACIÓN DE SUPABASE
        // ============================================================
        const SUPABASE_URL = 'https://djpjgublkjtmprkcypma.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_OubYYAQ-C5XmuF0i042wWA_4LLRtimJ';
        
        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // VARIABLES GLOBALES
        // ============================================================
        let pendingRegisterEmail = '';
        let pendingRegisterPassword = '';
        let otpToken = ''; // Para almacenar el token del OTP de Supabase

        // ============================================================
        // CAMBIAR ENTRE TABS
        // ============================================================
        function switchTab(tab) {
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const loginBtn = document.querySelector('.tab-btn:nth-child(1)');
            const registerBtn = document.querySelector('.tab-btn:nth-child(2)');

            if (tab === 'login') {
                loginTab.classList.remove('hidden');
                registerTab.classList.add('hidden');
                loginBtn.classList.add('tab-active');
                registerBtn.classList.remove('tab-active');
            } else {
                loginTab.classList.add('hidden');
                registerTab.classList.remove('hidden');
                loginBtn.classList.remove('tab-active');
                registerBtn.classList.add('tab-active');
            }
        }

        // ============================================================
        // LOGIN CON SUPABASE
        // ============================================================
        async function attemptLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            // Validación básica
            if (!email) {
                showFieldError('loginEmail', 'Email requerido');
                return;
            }
            if (!password) {
                showFieldError('loginPassword', 'Contraseña requerida');
                return;
            }

            // Mostrar loading
            const btn = event.target;
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-mini"></span>Accediendo...';

            try {
                // Llamar a Supabase Auth
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    showToast(`Error: ${error.message}`, 'error');
                    clearFieldErrors();
                    showFieldError('loginEmail', error.message);
                } else {
                    // Login exitoso
                    showToast('¡Acceso exitoso!', 'success');
                    // Redirigir al dashboard
                    setTimeout(() => {
                        window.location.href = 'plaza-market-panel-carga-productos.html';
                    }, 1000);
                }
            } catch (err) {
                showToast('Error de conexión', 'error');
                console.error('Error:', err);
            }

            btn.disabled = false;
            btn.innerHTML = originalText;
        }

        // ============================================================
        // REGISTRO CON SUPABASE
        // ============================================================
        async function attemptRegister() {
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const termsAccepted = document.getElementById('regTerms').checked;

            // Validación
            clearFieldErrors();
            let hasError = false;

            if (!email) {
                showFieldError('regEmail', 'Email requerido');
                hasError = true;
            }
            if (password.length < 6) {
                showFieldError('regPassword', 'Mínimo 6 caracteres');
                hasError = true;
            }
            if (!termsAccepted) {
                showToast('Debes aceptar los Términos y Condiciones', 'error');
                hasError = true;
            }

            if (hasError) return;

            // Guardar datos temporales
            pendingRegisterEmail = email;
            pendingRegisterPassword = password;

            // Mostrar loading
            const btn = event.target;
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-mini"></span>Registrando...';

            try {
                // Registrar en Supabase Auth (esto envía OTP automáticamente)
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        emailRedirectTo: window.location.origin + '/plaza-market-panel-carga-productos.html'
                    }
                });

                if (error) {
                    showToast(`Error: ${error.message}`, 'error');
                    showFieldError('regEmail', error.message);
                } else {
                    // Mostrar pantalla de OTP
                    document.getElementById('otpEmailDisplay').textContent = email;
                    document.getElementById('registerStepFields').classList.add('hidden');
                    document.getElementById('registerStepVerify').classList.remove('hidden');
                    showToast('Código OTP enviado a tu email', 'info');
                    focusFirstOtp('reg');
                }
            } catch (err) {
                showToast('Error de conexión', 'error');
                console.error('Error:', err);
            }

            btn.disabled = false;
            btn.innerHTML = originalText;
        }

        // ============================================================
        // VERIFICAR OTP DEL REGISTRO
        // ============================================================
        async function verifyRegistrationOtp() {
            const otpCode = getOtpValue('reg', 6);

            if (otpCode.length !== 6) {
                showToast('Ingresa los 6 dígitos', 'error');
                markOtpError('reg', 6);
                return;
            }

            // Mostrar loading
            const btn = event.target;
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-mini"></span>Verificando...';

            try {
                // Verificar OTP en Supabase
                const { data, error } = await supabase.auth.verifyOtp({
                    email: pendingRegisterEmail,
                    token: otpCode,
                    type: 'email'
                });

                if (error) {
                    showToast(`Error: ${error.message}`, 'error');
                    markOtpError('reg', 6);
                    document.getElementById('otpMessage').innerHTML = `<span class="text-red-400">❌ Código incorrecto</span>`;
                } else {
                    // OTP verificado correctamente
                    showSuccessScreen();
                }
            } catch (err) {
                showToast('Error de conexión', 'error');
                console.error('Error:', err);
            }

            btn.disabled = false;
            btn.innerHTML = originalText;
        }

        // ============================================================
        // RESEND OTP
        // ============================================================
        async function resendOtpCode() {
            if (!pendingRegisterEmail) {
                showToast('Email no disponible', 'error');
                return;
            }

            try {
                const { error } = await supabase.auth.resend({
                    type: 'signup',
                    email: pendingRegisterEmail
                });

                if (error) {
                    showToast(`Error: ${error.message}`, 'error');
                } else {
                    showToast('Código reenviado a tu email', 'success');
                    clearOtpInputs('reg', 6);
                    focusFirstOtp('reg');
                }
            } catch (err) {
                showToast('Error de conexión', 'error');
                console.error('Error:', err);
            }
        }

        // ============================================================
        // VOLVER AL FORMULARIO DE REGISTRO
        // ============================================================
        function goBackToRegister() {
            clearOtpInputs('reg', 6);
            document.getElementById('otpMessage').textContent = '';
            document.getElementById('registerStepVerify').classList.add('hidden');
            document.getElementById('registerStepFields').classList.remove('hidden');
            showToast('Volviste al formulario de registro', 'info');
        }

        // ============================================================
        // PANTALLA DE ÉXITO
        // ============================================================
        function showSuccessScreen() {
            document.getElementById('successTitle').textContent = '¡Cuenta Verificada!';
            document.getElementById('successMessage').innerHTML = `Tu cuenta de Emprendedor fue activada correctamente.<br><strong class="text-slate-200">${pendingRegisterEmail}</strong>`;
            const link = document.getElementById('successDashboardLink');
            link.href = 'plaza-market-panel-carga-productos.html';
            link.textContent = 'Ir a mi Panel de Carga de Productos →';
            document.getElementById('successModal').classList.remove('hidden');
        }

        function closeSuccessAndReset() {
            document.getElementById('successModal').classList.add('hidden');
            document.getElementById('loginEmail').value = '';
            document.getElementById('loginPassword').value = '';
            document.getElementById('regEmail').value = '';
            document.getElementById('regPassword').value = '';
            document.getElementById('regTerms').checked = false;
            document.getElementById('registerStepVerify').classList.add('hidden');
            document.getElementById('registerStepFields').classList.remove('hidden');
            switchTab('login');
        }

        // ============================================================
        // UTILIDADES DE CAMPOS
        // ============================================================
        function showFieldError(fieldId, message) {
            const field = document.getElementById(fieldId);
            const messageDiv = document.getElementById(fieldId + 'Message');
            
            if (field) {
                field.classList.add('input-error');
                field.classList.remove('input-success');
            }
            if (messageDiv) {
                messageDiv.innerHTML = `<span class="icon-error">✗</span> ${message}`;
                messageDiv.classList.add('error');
                messageDiv.classList.remove('success');
            }
        }

        function clearFieldErrors() {
            const fields = ['loginEmail', 'loginPassword', 'regEmail', 'regPassword'];
            fields.forEach(id => {
                const field = document.getElementById(id);
                const messageDiv = document.getElementById(id + 'Message');
                if (field) {
                    field.classList.remove('input-error', 'input-success');
                }
                if (messageDiv) {
                    messageDiv.textContent = '';
                    messageDiv.classList.remove('error', 'success');
                }
            });
        }

        // ============================================================
        // UTILIDADES OTP
        // ============================================================
        function setupOtpInputs(prefix, length, onComplete) {
            for (let i = 0; i < length; i++) {
                const input = document.getElementById(`${prefix}Otp${i}`);
                if (!input) continue;

                input.addEventListener('input', (e) => {
                    const val = e.target.value.replace(/\D/g, '');
                    e.target.value = val.slice(0, 1);
                    e.target.classList.remove('error');
                    if (val && i < length - 1) document.getElementById(`${prefix}Otp${i + 1}`).focus();
                    updateOtpFilledState(prefix, length);
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && i > 0) {
                        document.getElementById(`${prefix}Otp${i - 1}`).focus();
                    }
                });

                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const paste = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
                    for (let j = 0; j < length; j++) {
                        const target = document.getElementById(`${prefix}Otp${j}`);
                        if (target) target.value = paste[j] || '';
                    }
                    updateOtpFilledState(prefix, length);
                    const nextInput = document.getElementById(`${prefix}Otp${Math.min(paste.length, length - 1)}`);
                    if (nextInput) nextInput.focus();
                });
            }
        }

        function getOtpValue(prefix, length) {
            let value = '';
            for (let i = 0; i < length; i++) {
                const input = document.getElementById(`${prefix}Otp${i}`);
                value += input ? (input.value || '') : '';
            }
            return value;
        }

        function clearOtpInputs(prefix, length) {
            for (let i = 0; i < length; i++) {
                const input = document.getElementById(`${prefix}Otp${i}`);
                if (input) {
                    input.value = '';
                    input.classList.remove('filled', 'error');
                }
            }
        }

        function focusFirstOtp(prefix) {
            const first = document.getElementById(`${prefix}Otp0`);
            if (first) first.focus();
        }

        function markOtpError(prefix, length) {
            for (let i = 0; i < length; i++) {
                const input = document.getElementById(`${prefix}Otp${i}`);
                if (input) input.classList.add('error');
            }
            setTimeout(() => {
                for (let i = 0; i < length; i++) {
                    const input = document.getElementById(`${prefix}Otp${i}`);
                    if (input) input.classList.remove('error');
                }
            }, 500);
        }

        function updateOtpFilledState(prefix, length) {
            for (let i = 0; i < length; i++) {
                const input = document.getElementById(`${prefix}Otp${i}`);
                if (input) {
                    if (input.value) input.classList.add('filled');
                    else input.classList.remove('filled');
                }
            }
        }

        // ============================================================
        // MOSTRAR/OCULTAR CONTRASEÑA
        // ============================================================
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><path d="M17.94 17.94A10.94 10.94 0 0112 20c-7 0-11-8-11-8a18.5 18.5 0 015.06-5.94M9.9 4.24A10.94 10.94 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
            } else {
                input.type = 'password';
                btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>`;
            }
        }

        // ============================================================
        // NOTIFICACIONES (TOAST)
        // ============================================================
        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = `toast ${type || 'info'}`;

            let icon = 'ℹ️';
            if (type === 'success') icon = '✅';
            if (type === 'error') icon = '🚫';

            toast.innerHTML = `
                <div class="flex gap-3 items-start">
                    <span class="text-xl flex-shrink-0">${icon}</span>
                    <div class="flex-1"><p class="font-semibold text-sm">${message}</p></div>
                    <button onclick="this.parentElement.parentElement.remove()" class="text-slate-500 hover:text-slate-300 flex-shrink-0">✕</button>
                </div>
            `;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 400);
            }, 5000);
        }

        // ============================================================
        // INICIALIZACIÓN
        // ============================================================
        window.addEventListener('DOMContentLoaded', function () {
            setupOtpInputs('reg', 6);
        });
    </script>
</body>
